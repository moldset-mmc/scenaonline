:root {
  --background: #faf9f7;
  --foreground: #232626;
  --card: #fff;
  --card-foreground: #232626;
  --popover: #fff;
  --popover-foreground: #232626;
  --primary: #91354e;
  --primary-foreground: #fff;
  --secondary: #f4eeed;
  --secondary-foreground: #232626;
  --muted: #f4f1ee;
  --muted-foreground: #716b69;
  --accent: #f4e8eb;
  --accent-foreground: #74273c;
  --destructive: #a2222a;
  --border: #dfdbd8;
  --input: #d9d5d2;
  --ring: #a1425c;
  --radius: .6rem;
  --font-sans: Arial,Helvetica,sans-serif;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--background);
  color: var(--foreground);
  font-family: Arial,Helvetica,sans-serif;
  font-size: 16px;
  line-height: 1.5;
}
button,a,input,textarea {
  touch-action: manipulation;
}
button {
  cursor: pointer;
}
a {
  color: inherit;
  text-decoration: none;
}
button:disabled {
  cursor: not-allowed;
}
::selection {
  background: #efd0da;
}
:focus-visible {
  outline: 3px solid #ac5971;
  outline-offset: 4px;
}
.site-shell {
  max-width: 1440px;
  margin: auto;
  padding: 0 64px;
}
.topbar {
  height: 104px;
  display: flex;
  align-items: center;
  gap: 36px;
  border-bottom: 1px solid var(--border);
}
.wordmark {
  font-weight: 800;
  font-size: 32px;
  letter-spacing: -1.6px;
  line-height: 1;
}
.wordmark span {
  font-size: 12px;
  vertical-align: top;
  margin-left: 4px;
  letter-spacing: 0;
}
.topbar-note {
  font-size: 13px;
  color: #706965;
}
.demo-link {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-left: auto;
  font-size: 14px;
}
.demo-link:hover {
  color: var(--primary);
}
.workspace {
  display: grid;
  grid-template-columns: 320px minmax(0,1fr);
  gap: 65px;
  padding: 54px 0 40px;
  align-items: start;
}
.eyebrow {
  font-size: 11px;
  letter-spacing: 2.1px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 9px;
}
.small-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--primary);
}
.sidebar h1 {
  font: 400 42px/1.14 Georgia,'Times New Roman',serif;
  letter-spacing: -1.4px;
  margin: 24px 0 18px;
}
.sidebar h1 em {
  font-weight: 400;
  color: var(--primary);
}
.intro {
  color: #77706c;
  font-size: 15px;
  line-height: 1.65;
  margin: 0;
}
.step-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-top: 40px;
}
.step-link[data-slot=button] {
  height: 47px;
  padding: 6px 13px 6px 0;
  border-radius: 0;
  width: 100%;
  display: flex;
  justify-content: flex-start;
  gap: 14px;
  color: #6f6b68;
  font-size: 14px;
  font-weight: 400;
}
.step-link .step-number {
  width: 29px;
  height: 29px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid #dfdbd6;
  border-radius: 50%;
  font-size: 11px;
  color: #7c746e;
}
.step-link.active {
  color: var(--primary);
  font-weight: 700;
}
.step-link.active .step-number {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}
.step-link>svg {
  margin-left: auto;
}
.side-note {
  display: flex;
  align-items: center;
  gap: 17px;
  margin-top: 40px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
}
.asterisk {
  color: var(--primary);
  font-size: 48px;
  line-height: 1;
}
.side-note p {
  font-size: 12px;
  line-height: 1.7;
  color: #7e7770;
}
.side-note strong {
  font-weight: 400;
  color: #403a37;
}
.form-panel {
  background: #fff;
  border: 1px solid #e2deda;
  border-radius: 3px;
  padding: 34px 42px 24px;
  min-width: 0;
  box-shadow: 0 12px 32px #4a2b3010;
  min-height: 667px;
}
.form-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.form-top .eyebrow {
  font-size: 10px;
  color: #77706c;
  letter-spacing: 1.65px;
}
.step-count {
  font-size: 20px;
  color: var(--primary);
  font-weight: 500;
}
.step-count span {
  font-size: 13px;
  color: #a19b96;
  margin-left: 3px;
}
.progress-track {
  height: 3px;
  background: #f0edeb;
  margin: 18px 0 30px;
  overflow: hidden;
}
.progress-track>span {
  display: block;
  background: var(--primary);
  height: 100%;
  transition: width .25s ease;
}
.step-heading h2 {
  font: 400 33px/1.2 Georgia,'Times New Roman',serif;
  letter-spacing: -.6px;
  margin: 0 0 13px;
  outline: none;
}
.step-heading p {
  font-size: 14px;
  line-height: 1.65;
  color: #7b7370;
  margin: 0 0 28px;
  max-width: 480px;
}
.step-fields {
  border: 0;
  padding: 0;
  margin: 0;
  min-width: 0;
}
.two-columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}
.field {
  margin-bottom: 24px;
  min-width: 0;
}
.field label,.field-label {
  display: block;
  font-weight: 500;
  font-size: 14px;
  margin-bottom: 10px;
}
.required {
  color: var(--primary);
}
.optional {
  font-size: 11px;
  color: #948a83;
  font-weight: 400;
  float: right;
  margin-top: 3px;
}
.field [data-slot=input],.field [data-slot=textarea] {
  background: #fff;
  height: 48px;
  border-radius: 5px;
  box-shadow: none;
  padding: 12px 14px;
  font-size: 15px;
  line-height: 1.5;
}
.field [data-slot=textarea] {
  min-height: 124px;
  resize: vertical;
  field-sizing: fixed;
}
.field input::placeholder,.field textarea::placeholder {
  color: #948e89;
  font-size: 14px;
}
.choices {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
}
.choice[data-slot=button] {
  border: 1px solid #e0dcd9;
  background: white;
  color: #6a6460;
  border-radius: 5px;
  padding: 10px 13px;
  height: auto;
  min-height: 43px;
  font-weight: 400;
  font-size: 13px;
  box-shadow: none;
  white-space: normal;
  text-align: left;
  justify-content: space-between;
  gap: 10px;
}
.choice.selected {
  border-color: #a85068;
  background: #fcf2f4;
  color: #842e46;
}
.choice-mark {
  width: 15px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.choice:not(.selected) .choice-mark:empty {
  display: none;
}
.quiet-tip {
  border-left: 2px solid #d5a1af;
  padding: 0 0 0 17px;
  display: flex;
  gap: 18px;
  align-items: center;
  margin-top: 30px;
  margin-bottom: 36px;
}
.quiet-tip>span {
  font-size: 10px;
  letter-spacing: 1px;
  color: #9a3f57;
  white-space: nowrap;
}
.quiet-tip p {
  font-size: 12px;
  color: #8b807a;
  line-height: 1.7;
  margin: 0;
}
.form-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid #eee9e5;
  padding-top: 23px;
  margin-top: 26px;
  gap: 10px;
}
.primary-button[data-slot=button] {
  height: 49px;
  padding: 0 23px;
  border-radius: 5px;
  font-size: 14px;
  font-weight: 500;
  box-shadow: 0 4px 9px #91354e18;
  gap: 18px;
}
.back-button[data-slot=button] {
  height: 44px;
  font-weight: 400;
  padding: 0 6px;
  font-size: 13px;
  color: #77706c;
}
.form-footnote {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  margin-top: 17px;
  font-size: 10px;
  line-height: 1.5;
  color: #8b837d;
}
.form-footnote svg {
  flex-shrink: 0;
}
.footer {
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  gap: 18px;
  padding: 22px 0 28px;
  color: #918880;
  font-size: 10px;
  letter-spacing: .15px;
}
.footer-star {
  font-size: 17px;
  color: var(--primary);
  vertical-align: middle;
  margin-left: 10px;
}
.field-hint {
  font-size: 12px;
  line-height: 1.6;
  color: #857b75;
  margin: 0 0 12px;
}
.counter {
  display: block;
  text-align: right;
  margin-top: 5px;
  color: #948a83;
  font-size: 11px;
}
.style-choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
}
.style-choices .choice {
  display: grid;
  grid-template-columns: 1fr 16px;
  padding: 11px;
  gap: 10px;
  font-size: 12px;
}
.style-swatch {
  grid-column: 1/-1;
  display: flex;
  gap: 6px;
  align-items: center;
  height: 58px;
  width: 100%;
  background: #f7f3ed;
  padding: 12px;
  overflow: hidden;
}
.style-swatch>span {
  font: 30px Georgia,serif;
  margin-right: auto;
}
.style-swatch i {
  width: 18px;
  height: 28px;
  background: #fff;
  border: 1px solid #e6ddd4;
}
.style-swatch i:last-child {
  background: #d1b6a8;
}
.style-1 .style-swatch {
  background: #aa3153;
  color: white;
}
.style-1 .style-swatch i {
  background: #e2a3b2;
  border: 0;
}
.style-1 .style-swatch i:last-child {
  background: #edbb5a;
}
.style-2 .style-swatch {
  background: #303b39;
  color: #f0e8da;
}
.style-2 .style-swatch i {
  background: #bcb7a8;
  border: 0;
}
.style-2 .style-swatch i:last-child {
  background: #827c6c;
}
.style-3 .style-swatch {
  background: #f5f0f4;
  color: #917084;
}
.style-3 .style-swatch i {
  border-radius: 50%;
  width: 23px;
  height: 23px;
  background: #ba98a7;
  border: 0;
}
.style-3 .style-swatch i:last-child {
  background: #dfc6d1;
}
.upload-zone {
  border: 1px dashed #c5a5ad;
  padding: 20px;
  display: flex !important;
  align-items: center;
  gap: 14px;
  background: #fcf8f9;
  cursor: pointer;
  min-height: 90px;
  border-radius: 6px;
  color: var(--primary);
}
.upload-zone strong {
  font-size: 14px;
  font-weight: 500;
}
.upload-zone small {
  display: block;
  color: #92817f;
  font-size: 11px;
  margin-top: 4px;
}
.upload-zone>svg:last-child {
  margin-left: auto;
}
.file-input {
  position: absolute;
  width: 1px !important;
  height: 1px !important;
  clip-path: inset(50%);
  overflow: hidden;
}
.field:has(.file-input:focus-visible) .upload-zone {
  outline: 3px solid #ac5971;
  outline-offset: 4px;
}
.photo-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
  margin: 12px 0;
}
.photo {
  position: relative;
  aspect-ratio: 1;
  border-radius: 6px;
  overflow: hidden;
  background: #eee;
}
.photo>img {
  height: 100%;
  width: 100%;
  object-fit: cover;
}
.photo button {
  position: absolute;
  right: 6px;
  top: 6px;
  min-width: 36px;
  min-height: 36px;
}
.photo small {
  position: absolute;
  bottom: 5px;
  left: 6px;
  background: #ffffffdd;
  border-radius: 3px;
  padding: 1px 5px;
  font-size: 10px;
}
.account-row {
  padding: 17px 0;
  border-top: 1px solid #ede8e4;
}
.account-row strong {
  font-size: 15px;
  font-weight: 500;
}
.account-row p {
  font-size: 12px;
  color: #8a7e77;
  margin: 3px 0 12px;
}
.account-row+.field {
  margin-top: 22px;
}
.info-note {
  display: flex;
  gap: 11px;
  background: #f7f4f1;
  padding: 13px;
  color: #7c6e64;
  border-radius: 5px;
}
.info-note p {
  font-size: 12px;
  line-height: 1.6;
  margin: 0;
}
.info-note svg {
  flex-shrink: 0;
  margin-top: 2px;
}
.consent-row {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.consent-row [data-slot=checkbox] {
  width: 21px;
  height: 21px;
  flex-shrink: 0;
  margin-top: 2px;
}
.consent-row label {
  font-size: 12px;
  line-height: 1.7;
  color: #605851;
}
.privacy-note {
  font-size: 11px;
  color: #8e8179;
  line-height: 1.7;
  margin: 17px 0;
}
.notice,.connection-note {
  padding: 14px;
  background: #fff1e8;
  border-left: 3px solid #ba654b;
  font-size: 13px;
  line-height: 1.6;
  color: #834329;
  margin: 20px 0 0;
}
.field-error {
  font-size: 12px;
  color: #a2222a;
  margin: 7px 0 0;
  flex-basis: 100%;
}
.draft-restored {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  background: #f7f3ee;
  padding: 9px 12px;
  margin-bottom: 20px;
}
.draft-restored button {
  flex-shrink: 0;
}
.honeypot {
  position: absolute;
  left: -10000px;
  width: 1px;
  height: 1px;
  overflow: hidden;
}
.receipt {
  padding: 60px 0;
}
.receipt-symbol {
  width: 83px;
  height: 83px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #e7f0e9;
  color: #4b775d;
  margin-bottom: 28px;
}
.receipt-symbol.pending {
  background: #f8eee5;
  color: #a36e42;
}
.receipt h2 {
  font: 38px/1.2 Georgia,serif;
  margin: 20px 0;
}
.receipt p {
  font-size: 15px;
  line-height: 1.75;
  color: #7b716a;
}
.receipt-id {
  display: block;
  font-size: 11px;
  color: #9c8e83;
  overflow-wrap: anywhere;
  margin: 24px 0;
}
.receipt-link {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  color: var(--primary);
  margin-top: 35px;
}
.spin {
  animation: spin 1s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
@media (min-width:1440px) {
  .workspace {
    gap: 95px;
    grid-template-columns: 340px minmax(0,1fr);
  }
}
@media (max-width:1100px) {
  .site-shell {
    padding: 0 32px;
  }
  .workspace {
    gap: 32px;
    grid-template-columns: 250px minmax(0,1fr);
  }
  .sidebar h1 {
    font-size: 35px;
  }
  .form-panel {
    padding: 28px;
  }
  .topbar-note {
    display: none;
  }
  .two-columns {
    grid-template-columns: 1fr;
    gap: 0;
  }
}
@media (max-width:760px) {
  .site-shell {
    padding: 0 20px;
  }
  .topbar {
    height: 77px;
    gap: 16px;
  }
  .wordmark {
    font-size: 27px;
  }
  .demo-link {
    font-size: 12px;
    gap: 5px;
  }
  .workspace {
    display: block;
    padding: 29px 0 27px;
  }
  .sidebar h1 {
    font-size: 34px;
    margin: 15px 0 11px;
  }
  .sidebar h1 br {
    display: none;
  }
  .sidebar h1 em {
    display: block;
  }
  .sidebar .intro {
    font-size: 13px;
    line-height: 1.5;
  }
  .sidebar .intro br {
    display: none;
  }
  .sidebar .eyebrow {
    font-size: 9px;
    letter-spacing: 1.8px;
  }
  .step-list {
    flex-direction: row;
    gap: 0;
    margin: 23px 0;
  }
  .step-link[data-slot=button] {
    height: 35px;
    min-width: 36px;
    justify-content: center;
    flex: 1;
    padding: 0;
  }
  .step-link>span:nth-child(2),.step-link>svg {
    display: none;
  }
  .step-link .step-number {
    width: 30px;
    height: 30px;
  }
  .side-note {
    display: none;
  }
  .form-panel {
    padding: 25px 22px 20px;
    min-height: 0;
  }
  .step-heading h2 {
    font-size: 29px;
  }
  .step-heading p {
    font-size: 13px;
    margin-bottom: 25px;
  }
  .form-top .eyebrow {
    font-size: 9px;
    letter-spacing: 1.3px;
  }
  .field [data-slot=input],.field [data-slot=textarea] {
    font-size: 16px;
  }
  .field label,.field-label {
    font-size: 13px;
  }
  .choice[data-slot=button] {
    font-size: 12px;
    min-height: 44px;
    padding: 10px 12px;
  }
  .quiet-tip {
    margin-bottom: 26px;
    gap: 13px;
  }
  .form-actions {
    margin-top: 22px;
    padding-top: 20px;
  }
  .primary-button[data-slot=button] {
    padding: 0 17px;
    gap: 11px;
    font-size: 13px;
  }
  .form-footnote {
    font-size: 9px;
  }
  .footer {
    font-size: 9px;
    flex-direction: column;
    gap: 6px;
    padding: 18px 0 25px;
  }
  .receipt {
    padding: 25px 0;
  }
  .receipt h2 {
    font-size: 30px;
  }
  .photo-grid {
    grid-template-columns: repeat(2,1fr);
  }
  .upload-zone {
    padding: 15px;
    gap: 10px;
  }
  .upload-zone strong {
    font-size: 13px;
  }
}
@media (max-width:380px) {
  .site-shell {
    padding: 0 14px;
  }
  .form-panel {
    padding: 22px 17px;
  }
  .style-choices {
    grid-template-columns: 1fr;
  }
  .form-actions {
    flex-wrap: wrap;
  }
  .primary-button[data-slot=button] {
    gap: 8px;

.intake-view .choice:hover {
  background: #452d46;
  border-color: #a3789d;
}
.intake-view .choice.selected {
  background: #563348;
  border-color: #dca9ce;
  color: #ffe7f8;
}
.intake-view .choice-mark {
  color: #ebbbdb;
}
.intake-view .style-choices .choice {
  font-size: 13px;
}
.intake-view .field-hint,.intake-view .counter {
  color: #b39fc0;
  font-size: 13px;
}
.intake-view .quiet-tip {
  border-color: #98648c;
  gap: 15px;
}
.intake-view .quiet-tip>span {
  color: #d1a4c5;
  font-size: 12px;
}
.intake-view .quiet-tip p {
  color: #beabc9;
  font-size: 13px;
}
.intake-view .form-actions {
  border-color: #ffffff20;
}
.intake-view .primary-button[data-slot=button] {
  background: #efd7e5;
  color: #291324;
  border: 1px solid #efd7e5;
  border-radius: 2px;
  box-shadow: none;
  font-size: 15px;
  min-height: 50px;
}
.intake-view .primary-button:hover {
  background: #fff;
  color: #241120;
}
.intake-view .primary-button:disabled {
  opacity: .5;
}
.intake-view .back-button[data-slot=button] {
  color: #d0b8d2;
  font-size: 14px;
}
.intake-view .back-button:hover {
  background: #ffffff0c;
  color: white;
}
.intake-view .form-footnote {
  color: #ab96b7;
  font-size: 12px;
  gap: 8px;
}
.intake-view .clear-draft[data-slot=button] {
  color: #d1acce;
  font-size: 12px;
  min-height: 44px;
}
.intake-view .footer {
  border-color: #ffffff24;
  color: #aa97b7;
  font-size: 12px;
}
.intake-view .upload-zone {
  background: #3a24384a;
  border-color: #a377a0;
  color: #edc4e2;
  border-radius: 4px;
  padding: 20px 17px;
}
.intake-view .upload-zone strong {
  font-size: 15px;
}
.intake-view .upload-zone small {
  color: #bda6c6;
  font-size: 12px;
}
.intake-view .photo {
  background: #2b2132;
}
.intake-view .photo small {
  background: #211628e8;
  color: #f2d5e8;
  font-size: 12px;
}
.intake-view .photo button {
  color: #fff;
  background: #2c1d37;
}
.intake-view .account-row {
  border-color: #ffffff20;
}
.intake-view .account-row strong {
  color: #ecdeef;
}
.intake-view .account-row p {
  color: #b49cbe;
  font-size: 13px;
}
.intake-view .info-note {
  background: #302039;
  color: #d7bbd9;
  border: 1px solid #77568155;
}
.intake-view .info-note p {
  font-size: 14px;
}
.intake-view .consent-row label {
  color: #d5c1dd;
  font-size: 14px;
}
.intake-view .consent-row [data-slot=checkbox] {
  border-color: #b18da9;
  color: #291324;
}
.intake-view .privacy-note {
  color: #b5a0be;
  font-size: 13px;
}
.intake-view .notice,.intake-view .connection-note {
  background: #46263b;
  border-color: #d497b7;
  color: #f6d6e8;
  font-size: 14px;
}
.intake-view .field-error {
  color: #ffb2c8;
  font-size: 13px;
}
.intake-view .draft-restored {
  background: #3c2c43;
  color: #e2cce8;
  font-size: 13px;
}
.intake-view .draft-restored button {
  color: #e5cde7;
}
.intake-view .receipt p {
  color: #cab6d3;
  font-size: 16px;
}
.intake-view .receipt-id {
  color: #b99ec4;
  font-size: 12px;
}
.intake-view .receipt-link {
  color: #e7bbd9;
}
.intake-view .receipt-symbol {
  background: #294837;
  color: #c5efd5;
}
.intake-view .receipt-symbol.pending {
  background: #593843;
  color: #f3cbde;
}
@media (max-width:1100px) {
  .intake-view .workspace {
    gap: 32px;
    grid-template-columns: 245px minmax(0,1fr);
  }
  .intake-view .sidebar h1 {
    font-size: 36px;
  }
  .intake-view .form-panel {
    padding: 30px;
  }
}
@media (max-width:760px) {
  .intake-view .site-shell {
    padding: 0 20px;
  }
  .intake-view .topbar {
    height: 70px;
    gap: 12px;
  }
  .intake-view .wordmark {
    font-size: 21px;
    letter-spacing: -.7px;
  }
  .intake-view .form-cover-back {
    font-size: 13px;
    gap: 6px;
  }
  .intake-view .workspace {
    display: block;
    padding: 24px 0 30px;
  }
  .intake-view .sidebar h1 {
    font-size: 31px;
    line-height: 1.2;
    margin: 0 0 14px;
  }
  .intake-view .step-list {
    margin: 15px 0 20px;
  }
  .intake-view .step-link[data-slot=button] {
    min-height: 44px;
    padding: 0;
  }
  .intake-view .step-number {
    width: 32px;
    height: 32px;
  }
  .intake-view .form-panel {
    padding: 24px 20px 18px;
    min-height: 0;
  }
  .intake-view .form-top .eyebrow {
    font-size: 10px;
    letter-spacing: .8px;
  }
  .intake-view .step-heading h2 {
    font-size: 31px;
  }
  .intake-view .step-heading p {
    font-size: 16px;
    margin-bottom: 24px;
    line-height: 1.55;
  }
  .intake-view .progress-track {
    margin: 16px 0 23px;
  }
  .intake-view .field label,.intake-view .field-label {
    font-size: 14px;
  }
  .intake-view .choice[data-slot=button] {
    font-size: 14px;
    padding: 10px 12px;
    min-height: 45px;
  }
  .intake-view .style-choices .choice {
    font-size: 13px;
  }
  .intake-view .quiet-tip {
    margin-top: 24px;
    margin-bottom: 27px;
    gap: 12px;
  }
  .intake-view .quiet-tip p {
    font-size: 13px;
  }
  .intake-view .form-actions {
    margin-top: 23px;
    padding-top: 20px;
  }
  .intake-view .primary-button[data-slot=button] {
    font-size: 15px;
    padding: 0 18px;
  }
  .intake-view .form-footnote {
    font-size: 12px;
    align-items: flex-start;
    margin-top: 18px;
  }
  .intake-view .form-footnote>svg {
    margin-top: 3px;
  }
  .intake-view .clear-draft[data-slot=button] {
    margin-top: -8px;
  }
  .intake-view .footer {
    font-size: 12px;
    line-height: 1.6;
    gap: 8px;
  }
  .intake-view .optional {
    float: none;
    display: block;
    margin-top: 3px;
  }
  .intake-view .receipt {
    padding: 25px 0;
  }
}
@media (max-width:360px) {
  .intake-view .site-shell {
    padding: 0 15px;
  }
  .intake-view .form-panel {
    padding: 22px 16px 18px;
  }
  .intake-view .sidebar h1 {
    font-size: 29px;
  }
  .intake-view .form-top .eyebrow {
    font-size: 9px;
    letter-spacing: .45px;
  }
  .intake-view .form-cover-back {
    font-size: 12px;
  }
  .intake-view .wordmark {
    font-size: 20px;
  }
}

.cover,.card-journey {
  font-family: Manrope,Arial,sans-serif;
}
.stage-image {
  animation: scena-approach 10s cubic-bezier(.16,.5,.3,1) infinite;
  transform-origin: 50% 65%;
}
.stage-art {
  animation: stage-arrive .8s ease-out both;
}
@keyframes scena-approach {
  0%,100% {
    transform: scale(1.02);
  }
  48%,65% {
    transform: scale(1.19);
  }
}
.stage-brand h1 {
  font-size: clamp(4rem,10vw,6rem);
}
.stage-description,.example-intro {
  text-wrap: pretty;
}
.cover-primary[data-slot=button] {
  height: auto;
  min-height: 54px;
  padding-block: 14px;
  white-space: normal;
  line-height: 1.5;
  box-shadow: none;
}
.cover ::selection {
  background: #eed4e0;
  color: #291921;
}
.card-journey {
  --j-bg: #100f14;
  --j-ink: #faf2f6;
  --j-muted: #c9bac6;
  --j-accent: #eed4e0;
  --j-border: #796873;
  --j-rule: #493e46;
  --j-error: #ffc1c5;
  --j-small: .875rem;
  --j-body: 1rem;
  --j-title: clamp(1.875rem,4vw,2.625rem);
  background: var(--j-bg);
  color: var(--j-ink);
  min-height: 100svh;
  padding: 0 max(20px,env(safe-area-inset-right)) 28px max(20px,env(safe-area-inset-left));
  caret-color: var(--j-accent);
  accent-color: var(--j-accent);
  color-scheme: dark;
  font-size: var(--j-body);
  line-height: 1.6;
  scrollbar-color: var(--j-border) var(--j-bg);
}
.card-journey ::selection {
  background: var(--j-accent);
  color: #291921;
}
.card-journey :focus-visible {
  outline: 3px solid #eec3de;
  outline-offset: 4px;
}
.card-journey :is(button,input,select) {
  font: inherit;
  min-width: 0;
}
.card-journey button {
  cursor: pointer;
}
.card-journey button:disabled {
  opacity: .55;
  cursor: wait;
}
.card-journey :is(button,summary,a) {
  touch-action: manipulation;
}
.card-journey :is(p,label,summary) {
  overflow-wrap: anywhere;
}
.card-journey p {
  text-wrap: pretty;
}
.journey-header {
  max-width: 1120px;
  margin: auto;
  min-height: 72px;
  border-bottom: 1px solid var(--j-rule);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  scroll-margin-top: 0;
}
.journey-wordmark {
  font-size: 1.375rem;
  font-weight: 700;
  letter-spacing: -.04em;
  line-height: 1;
}
.journey-wordmark span {
  font-size: .875rem;
  margin-left: 3px;
  vertical-align: top;
}
.journey-header .form-cover-back {
  font-size: var(--j-small);
  min-height: 44px;
  border: 0;
  background: transparent;
  color: var(--j-muted);
  padding: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: normal;
}
.journey-header .form-cover-back svg {
  flex-shrink: 0;
}
.journey-main {
  max-width: 1120px;
  margin: auto;
}
.journey-intro {
  padding: 24px 0 16px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.journey-intro h1 {
  font-size: 1.125rem;
  line-height: 1.4;
  letter-spacing: -.02em;
  font-weight: 400;
  margin: 0;
}
.journey-intro p {
  color: var(--j-muted);
  font-size: var(--j-small);
  margin: 0;
  font-variant-numeric: tabular-nums;
}
.journey-progress {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 8px;
  margin: 0 0 24px;
}
.journey-progress button {
  border: 0;
  border-top: 2px solid var(--j-rule);
  background: transparent;
  color: var(--j-muted);
  min-height: 68px;
  padding: 12px 0 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 6px;
}
.journey-progress button.is-current {
  border-color: var(--j-accent);
  color: var(--j-ink);
}
.journey-progress button>span {
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  flex-shrink: 0;
  border: 1px solid var(--j-border);
  border-radius: 50%;
  font-size: .75rem;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.journey-progress button.is-current>span {
  background: var(--j-accent);
  color: #291921;
  border-color: var(--j-accent);
}
.journey-progress strong {
  font-weight: 400;
  font-size: var(--j-small);
  line-height: 1.4;
  overflow-wrap: anywhere;
}
.journey-body {
  display: grid;
  gap: 28px;
  align-items: start;
}
.journey-preview,.journey-editor {
  min-width: 0;
}
.journey-preview .personal-card {
  margin: auto;
}
.journey-heading h2 {
  font: 400 var(--j-title)/1.15 Georgia,serif;
  letter-spacing: -.02em;
  margin: 0 0 12px;
  text-wrap: balance;
  scroll-margin-top: 24px;
}
.journey-heading p {
  font-size: var(--j-body);
  line-height: 1.6;
  color: var(--j-muted);
  margin: 0 0 24px;
  max-width: 52ch;
}
.journey-field {
  margin: 0 0 20px;
}
.journey-field>label,.journey-options>legend,.contact-type-label {
  display: block;
  margin: 0 0 8px;
  font-size: var(--j-small);
  font-weight: 400;
}
.journey-field>label>span,.journey-details summary>span {
  font-size: .75rem;
  margin-left: 8px;
  font-weight: 400;
  color: var(--j-muted);
}
.journey-field input,.card-journey select {
  width: 100%;
  min-height: 54px;
  border: 1px solid var(--j-border);
  background: transparent;
  border-radius: 8px;
  color: var(--j-ink);
  padding: 12px 14px;
  box-shadow: none;
  font-size: var(--j-body);
  line-height: 1.5;
}
.journey-field input::placeholder {
  color: #b8a7b3;
}
.journey-field [aria-invalid=true] {
  border-color: var(--j-error);
}
.card-journey select {
  margin: 0 0 16px;
}
.journey-field select {
  margin: 0;
}
.card-journey select option {
  background: #211b23;
  color: #fff;
}
.journey-options {
  margin: 0 0 24px;
  padding: 0;
  border: 0;
  min-width: 0;
}
.journey-hint {
  font-size: var(--j-small);
  line-height: 1.65;
  color: var(--j-muted);
  margin: 12px 0 20px;
  max-width: 52ch;
}
.journey-error {
  color: var(--j-error);
  font-size: var(--j-small);
  line-height: 1.6;
  margin: 8px 0 20px;
}
.portrait-upload {
  position: relative;
}
.portrait-upload label {
  display: flex;
  align-items: center;
  gap: 16px;
  min-height: 104px;
  padding: 20px;
  border: 1px dashed #b294a6;
  border-radius: 12px;
  cursor: pointer;
}
.portrait-upload label>svg {
  flex-shrink: 0;
  color: var(--j-accent);
}
.portrait-upload strong {
  display: block;
  font-size: var(--j-body);
  font-weight: 400;
  line-height: 1.5;
}
.portrait-upload small {
  display: block;
  font-size: var(--j-small);
  color: var(--j-muted);
  margin-top: 4px;
}
.portrait-upload input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
}
.portrait-upload:has(input:focus-visible) {
  outline: 3px solid #eec3de;
  outline-offset: 4px;
  border-radius: 12px;
}
.journey-details {
  border-top: 1px solid var(--j-rule);
  margin: 24px 0 20px;
}
.journey-details summary {
  min-height: 52px;
  cursor: pointer;
  font-size: var(--j-small);
  align-content: center;
  padding: 12px 2px;
  line-height: 1.6;
}
.journey-details summary::marker {
  color: var(--j-accent);
}
.journey-details[open]>summary {
  margin-bottom: 12px;
}
.identity-details {
  margin-top: 0;
  margin-bottom: 0;
}
.crop-fields {
  padding: 0 0 12px;
}
.crop-fields label {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: var(--j-small);
  color: var(--j-muted);
}
.crop-fields input {
  width: 100%;
  min-height: 44px;
  margin: 4px 0 12px;
  cursor: pointer;
  accent-color: var(--j-accent);
}
.crop-fields output {
  font-variant-numeric: tabular-nums;
}
.journey-check {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  min-height: 44px;
  font-size: var(--j-small);
  cursor: pointer;
  margin: 20px 0;
}
.journey-check input {
  width: 22px;
  height: 22px;
  margin: 2px 0 0;
  flex-shrink: 0;
  accent-color: var(--j-accent);
}
.journey-check small {

  .stage-image {
    animation-name: scena-approach-phone;
  }
  .stage-brand h1 {
    font-size: clamp(2.375rem,12vw,4.875rem);
  }
  .stage-art {
    height: 72%;
  }
  .stage-brand {
    top: 112px;
  }
  .stage-bottom {
    position: relative;
    inset: auto;
    display: block;
    padding: clamp(320px,49svh,470px) 24px 108px;
  }
  .stage-description {
    max-width: 34ch;
  }
  .stage-statement h2 {
    font-size: clamp(3rem,14vw,4.125rem);

  }

  }
  .cover-logo {
    font-size: 1.3125rem;
  }
  .cover-share[data-slot=button] {
    font-size: .875rem;

  .cover-actions .cover-primary[data-slot=button] {
    font-size: 1rem;
  }
  .example-heading h2 {
    text-wrap: balance;
  }
  .example-intro {
    font-size: 1rem;

  .example-personal-card .personal-card {

  }
  .example-live-link {
    font-size: .875rem;
  }
  @keyframes scena-approach-phone {

  }
